map $http_host $api_proxy_origin {
    default "";
    "projector-delegate-hulk.ngrok-free.dev" "https";
    "localhost:3000" "http";
    "127.0.0.1:3000" "http";
    "localhost:3001" "http";
    "127.0.0.1:3001" "http";
}

server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # El frontend puede acceder a la API bajo el mismo origen, también detrás
    # del túnel HTTPS. No propagar encabezados de host arbitrarios al backend.
    location /api/ {
        if ($api_proxy_origin = "") { return 400; }
        set $api_backend backend:8080;
        proxy_pass http://$api_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $api_proxy_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Desactivar cache para config.js para que siempre tome la configuración inyectada
    location = /config.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
