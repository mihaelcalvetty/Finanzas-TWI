# ============================================================
# Finanzas-TWI — Docker Compose RELEASE (4 Instancias Multi-Nodo)
# ============================================================
# Por defecto compila el código local; RELEASE_IMAGE permite usar otra etiqueta.
#
# Uso:
#   docker compose -f docker-compose.release.yml up -d --build
# ============================================================

name: finanzas-twi-release

services:

  # ----------------------------------------------------------
  # Base de Datos PostgreSQL Compartida
  # ----------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: finanzas-db-release
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RELEASE_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: finanzas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_cambiar}
    volumes:
      - pgdata_release:/var/lib/postgresql/data
    networks:
      - finanzas-release-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finanzas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------
  # Plantilla base para las instancias de API (.NET 10)
  # ----------------------------------------------------------
  # Todas las instancias comparten:
  # 1. La misma imagen Docker Hub (leonardocaceres/finanzasbeof:v1.0.0)
  # 2. La misma base de datos PostgreSQL
  # 3. El mismo volumen 'dp_keys_release' para DataProtection (cifrado de cookies)
  # ----------------------------------------------------------

  migrate:
    image: ${RELEASE_IMAGE:-finanzas-twi-release:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=finanzas_db;Username=postgres;Password=${DB_PASSWORD:-dev_password_cambiar}
      ASPNETCORE_ENVIRONMENT: Production
      MIGRATE_DATABASE_ONLY: "true"
      DATA_PROTECTION_KEYS_PATH: /app/dataprotection-keys
    volumes:
      - dp_keys_release:/app/dataprotection-keys
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finanzas-release-net
    restart: "no"

  api-1:
    image: ${RELEASE_IMAGE:-finanzas-twi-release:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finanzas-api-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:8080"
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=finanzas_db;Username=postgres;Password=${DB_PASSWORD:-dev_password_cambiar}
      ASPNETCORE_ENVIRONMENT: Production
      DISABLE_HTTPS_REDIRECTION: "true"
      USE_HTTP_COOKIES: "true"
      AUTH_COOKIE_NAME: .FinanzasPersonales.Release.Auth
      ANTIFORGERY_COOKIE_NAME: Finanzas.Release.Antiforgery
      DATA_PROTECTION_KEYS_PATH: /app/dataprotection-keys
      CORS_ALLOWED_ORIGINS: >-
        http://localhost:3000,http://localhost:3001,http://localhost:5001,http://localhost:5002,http://localhost:5003,http://localhost:5004,http://localhost:5500,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:5001,http://127.0.0.1:5002,http://127.0.0.1:5003,http://127.0.0.1:5004
    volumes:
      - dp_keys_release:/app/dataprotection-keys
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      finanzas-release-net:
        aliases:
          - backend

  api-2:
    image: ${RELEASE_IMAGE:-finanzas-twi-release:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finanzas-api-2
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:8080"
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=finanzas_db;Username=postgres;Password=${DB_PASSWORD:-dev_password_cambiar}
      ASPNETCORE_ENVIRONMENT: Production
      DISABLE_HTTPS_REDIRECTION: "true"
      USE_HTTP_COOKIES: "true"
      AUTH_COOKIE_NAME: .FinanzasPersonales.Release.Auth
      ANTIFORGERY_COOKIE_NAME: Finanzas.Release.Antiforgery
      DATA_PROTECTION_KEYS_PATH: /app/dataprotection-keys
      CORS_ALLOWED_ORIGINS: >-
        http://localhost:3000,http://localhost:3001,http://localhost:5001,http://localhost:5002,http://localhost:5003,http://localhost:5004,http://localhost:5500,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:5001,http://127.0.0.1:5002,http://127.0.0.1:5003,http://127.0.0.1:5004
    volumes:
      - dp_keys_release:/app/dataprotection-keys
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - finanzas-release-net

  api-3:
    image: ${RELEASE_IMAGE:-finanzas-twi-release:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finanzas-api-3
    restart: unless-stopped
    ports:
      - "127.0.0.1:5003:8080"
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=finanzas_db;Username=postgres;Password=${DB_PASSWORD:-dev_password_cambiar}
      ASPNETCORE_ENVIRONMENT: Production
      DISABLE_HTTPS_REDIRECTION: "true"
      USE_HTTP_COOKIES: "true"
      AUTH_COOKIE_NAME: .FinanzasPersonales.Release.Auth
      ANTIFORGERY_COOKIE_NAME: Finanzas.Release.Antiforgery
      DATA_PROTECTION_KEYS_PATH: /app/dataprotection-keys
      CORS_ALLOWED_ORIGINS: >-
        http://localhost:3000,http://localhost:3001,http://localhost:5001,http://localhost:5002,http://localhost:5003,http://localhost:5004,http://localhost:5500,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:5001,http://127.0.0.1:5002,http://127.0.0.1:5003,http://127.0.0.1:5004
    volumes:
      - dp_keys_release:/app/dataprotection-keys
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - finanzas-release-net

  api-4:
    image: ${RELEASE_IMAGE:-finanzas-twi-release:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finanzas-api-4
    restart: unless-stopped
    ports:
      - "127.0.0.1:5004:8080"
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=finanzas_db;Username=postgres;Password=${DB_PASSWORD:-dev_password_cambiar}
      ASPNETCORE_ENVIRONMENT: Production
      DISABLE_HTTPS_REDIRECTION: "true"
      USE_HTTP_COOKIES: "true"
      AUTH_COOKIE_NAME: .FinanzasPersonales.Release.Auth
      ANTIFORGERY_COOKIE_NAME: Finanzas.Release.Antiforgery
      DATA_PROTECTION_KEYS_PATH: /app/dataprotection-keys
      CORS_ALLOWED_ORIGINS: >-
        http://localhost:3000,http://localhost:3001,http://localhost:5001,http://localhost:5002,http://localhost:5003,http://localhost:5004,http://localhost:5500,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:5001,http://127.0.0.1:5002,http://127.0.0.1:5003,http://127.0.0.1:5004
    volumes:
      - dp_keys_release:/app/dataprotection-keys
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - finanzas-release-net

  # ----------------------------------------------------------
  # Frontend Nginx
  # ----------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Front/Dockerfile
    container_name: finanzas-frontend-release
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RELEASE_FRONTEND_PORT:-3001}:80"
    environment:
      # Inicia apuntando a la primera instancia (5001)
      API_URL: "http://localhost:5001"
    depends_on:
      - api-1
      - api-2
      - api-3
      - api-4
    networks:
      - finanzas-release-net

# ----------------------------------------------------------
# Volúmenes y redes
# ----------------------------------------------------------
volumes:
  pgdata_release:
    name: finanzas-pgdata-release
  dp_keys_release:
    name: finanzas-dp-keys-release

networks:
  finanzas-release-net:
    name: finanzas-network-release
    driver: bridge
